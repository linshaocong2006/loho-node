name: Client UI preview
on:
  push:
    branches: [clients-v1, clients-performance, users-avatars, layout-polish, mobile-layout, zoom-font, back-font, compact-android]
    paths: ['clients/qa/**', '.github/workflows/client-preview.yml', 'loho-node-onekey.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Render real phone and iPad layouts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          bash loho-node-onekey.sh --extract-source /tmp/loho-preview
          python3 clients/qa/check_profiles.py /tmp/loho-preview
          node clients/qa/preview.mjs /tmp/loho-preview/www client-previews
      - name: Verify modal bounds and avatars in Chrome and WebKit
        run: |
          npm install --prefix "$RUNNER_TEMP/loho-playwright" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/loho-playwright/node_modules/.bin/playwright" install --with-deps webkit
          git show b36375a8ea922234d35feeaa4a3ff1f439faef3a:loho-node-onekey.sh > /tmp/loho-baseline.sh
          bash /tmp/loho-baseline.sh --extract-source /tmp/loho-baseline
          export LOHO_PLAYWRIGHT="$RUNNER_TEMP/loho-playwright/node_modules/playwright"
          node clients/qa/mobile-layout.mjs /tmp/loho-baseline/www client-previews/baseline --baseline
          node clients/qa/mobile-layout.mjs /tmp/loho-preview/www client-previews/fixed
      - name: Audit interaction recovery and incremental refresh
        run: |
          export LOHO_PLAYWRIGHT="$RUNNER_TEMP/loho-playwright/node_modules/playwright"
          node clients/qa/audit.mjs /tmp/loho-baseline/www client-previews/audit-baseline --baseline
          node clients/qa/audit.mjs /tmp/loho-preview/www client-previews/audit-fixed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: loho-client-previews
          path: client-previews/*
          if-no-files-found: warn
          retention-days: 3

