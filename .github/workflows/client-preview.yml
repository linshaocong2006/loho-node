name: Client UI preview
on:
  push:
    branches: [clients-v1, clients-performance, users-avatars, layout-polish]
    paths: ['clients/qa/**', '.github/workflows/client-preview.yml', 'loho-node-onekey.sh']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Render real phone and iPad layouts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          bash loho-node-onekey.sh --extract-source /tmp/loho-preview
          python3 clients/qa/check_profiles.py /tmp/loho-preview
          node clients/qa/preview.mjs /tmp/loho-preview/www client-previews
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: loho-client-previews
          path: client-previews/*
          if-no-files-found: warn
          retention-days: 3

